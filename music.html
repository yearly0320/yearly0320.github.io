<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐 - 烨烨的个人小站</title>
  <style>
    /* 复用主页面的基础样式，保证风格统一 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e8f1f8 100%);
      color: #333;
      line-height: 1.7;
      min-height: 100vh;
      padding: 40px 20px;
    }
    /* 头部导航栏 - 包含返回首页按钮 */
    .header {
      max-width: 800px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-home {
      padding: 10px 25px;
      background: rgba(255, 255, 255, 0.95);
      color: #4299e1;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      font-weight: 500;
    }
    .back-home:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(66, 153, 225, 0.15);
    }
    .page-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      background: linear-gradient(90deg, #4299e1, #38b2ac);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* 内容容器 */
    .content-container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      animation: fadeIn 0.8s ease-out;
    }
    /* 散文内容样式 */
    .prose-item {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .prose-title {
      font-size: 1.5rem;
      color: #2d3748;
      margin-bottom: 15px;
    }
    .prose-content {
      color: #4a5568;
      line-height: 1.8;
      text-align: justify;
    }
    .prose-meta {
      color: #718096;
      font-size: 0.9rem;
      margin-top: 10px;
    }
    .playlist-grid {
      display: grid;
      gap: 18px;
    }
    .playlist-card {
      display: block;
      padding: 22px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      text-decoration: none;
      color: #2d3748;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
      transition: all 0.25s ease;
    }
    .playlist-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(66, 153, 225, 0.16);
      border-color: rgba(66, 153, 225, 0.45);
    }
    .playlist-title {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #2d3748;
    }
    .playlist-desc {
      color: #718096;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    /* 通用动画 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* 响应式适配 */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      .content-container {
        padding: 20px;
      }
    }
    .site-stats {
      max-width: 1000px;
      margin: 36px auto 0;
      padding: 18px 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      color: #4a5568;
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .site-stats span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .site-stats strong {
      color: #2d3748;
      font-weight: 700;
    }
    .site-stats .stat-divider {
      color: #cbd5e0;
    }
  </style>
</head>
<body>
  <!-- 头部导航 -->
  <div class="header">
    <a href="index.html" class="back-home">← 返回首页</a>
    <h1 class="page-title">音乐</h1>
  </div>

  <div class="content-container">
    <div class="playlist-grid">
      <a class="playlist-card" href="https://music.apple.com/cn/playlist/kpop/pl.u-b3b8VGNiKVpxl67" target="_blank" rel="noopener noreferrer">
        <h2 class="playlist-title">K-pop 歌单</h2>
        <div class="playlist-desc">点击打开 Apple Music 网页端，收听我整理的 K-pop 歌单。</div>
      </a>
      <a class="playlist-card" href="https://music.apple.com/cn/playlist/cpop/pl.u-RRbVv15tmG8plLM" target="_blank" rel="noopener noreferrer">
        <h2 class="playlist-title">C-pop 歌单</h2>
        <div class="playlist-desc">点击打开 Apple Music 网页端，收听我整理的华语流行歌单。</div>
      </a>
      <a class="playlist-card" href="https://music.apple.com/cn/playlist/cantopop/pl.u-6mo4aoms86NavgL" target="_blank" rel="noopener noreferrer">
        <h2 class="playlist-title">Cantopop 歌单</h2>
        <div class="playlist-desc">点击打开 Apple Music 网页端，收听我整理的粤语流行歌单。</div>
      </a>
    </div>
  </div>
  </div>
  <div class="site-stats">
    <span>本设备访客 <strong><span data-local-stat="site-uv">--</span></strong> 人</span>
    <span class="stat-divider">|</span>
    <span>本设备总浏览 <strong><span data-local-stat="site-pv">--</span></strong> 次</span>
    <span class="stat-divider">|</span>
    <span>本设备本页浏览 <strong><span data-local-stat="page-pv">--</span></strong> 次</span>
  </div>
  <script>
    (function () {
      var path = window.location.pathname || '/';
      if (path.endsWith('/')) path += 'index.html';
      var sitePvKey = 'yearly0320_site_pv';
      var pagePvKey = 'yearly0320_page_pv_' + path;
      var visitorKey = 'yearly0320_site_visitor';
      var sitePv = Number(localStorage.getItem(sitePvKey) || 0) + 1;
      var pagePv = Number(localStorage.getItem(pagePvKey) || 0) + 1;
      localStorage.setItem(sitePvKey, String(sitePv));
      localStorage.setItem(pagePvKey, String(pagePv));
      if (!localStorage.getItem(visitorKey)) localStorage.setItem(visitorKey, '1');
      document.querySelectorAll('[data-local-stat="site-uv"]').forEach(function (el) { el.textContent = localStorage.getItem(visitorKey); });
      document.querySelectorAll('[data-local-stat="site-pv"]').forEach(function (el) { el.textContent = sitePv; });
      document.querySelectorAll('[data-local-stat="page-pv"]').forEach(function (el) { el.textContent = pagePv; });
    })();
  </script>
</body>
</html>
